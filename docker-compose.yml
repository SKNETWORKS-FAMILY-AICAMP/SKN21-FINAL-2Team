# local에서 backend까지 모두 띄움
# docker compose -f 'docker-compose.yml' up -d --build

services:
  mysql:
    platform: linux/amd64
    image: mysql:8.0
    container_name: mysql_container
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

  qdrant:
    platform: linux/amd64
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    platform: linux/amd64
    image: ollama/ollama:latest
    container_name: ollama_container
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREAD: "4"
    # Note: qwen2.5:3b will be pulled on first startup
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull qwen2.5:3b &&
      wait
      "

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  backend:
    platform: linux/amd64
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./backend:/app
      - hf_model_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mysql
      - qdrant
      - ollama

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=/api

  nginx:
    platform: linux/amd64
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  qdrant_data:
  ollama_data:
  hf_model_cache:    # HuggingFace 모델 캐시 (bge-m3, clip, bge-reranker-v2-m3)
