services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama   # 모델 파일 영구 보존
    restart: unless-stopped

  backend:
    build: .
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434  # 컨테이너 내부 통신
    depends_on:
      - ollama

volumes:
  ollama_data:
